<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sornsawan Sophapho | Personal Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #e0f2fe;
            --accent-blue: #0ea5e9;
            --primary-pink: #fdf2f8;
            --accent-pink: #db2777;
            --text-main: #1f2937;
            --text-sub: #4b5563;
            --white: #ffffff;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--white);
            color: var(--text-main);
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        /* Layout Helpers */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        section {
            padding: 80px 0;
        }

        .section-title {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 3rem;
            font-weight: 600;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background: linear-gradient(to right, var(--accent-blue), var(--accent-pink));
            margin: 10px auto;
            border-radius: 2px;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-pink) 100%);
            text-align: center;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-placeholder {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background-color: var(--white);
            margin-bottom: 2rem;
            border: 4px solid var(--white);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .profile-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .hero .tagline {
            font-size: 1.25rem;
            color: var(--accent-pink);
            font-weight: 400;
            max-width: 600px;
        }

        /* About Section */
        .about {
            background-color: var(--white);
        }

        .about-text {
            max-width: 750px;
            margin: 0 auto;
            text-align: center;
        }

        .about-text p {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            color: var(--text-sub);
        }

        /* Projects Section */
        .projects {
            background-color: #fafafa;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .project-card {
            background: var(--white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: var(--transition);
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.05);
        }

        .project-img {
            width: 100%;
            height: 200px;
            background-color: var(--primary-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            color: var(--accent-blue);
        }

        .project-info {
            padding: 1.5rem;
        }

        .project-info h3 {
            margin-bottom: 0.75rem;
            color: var(--text-main);
        }

        .project-info p {
            font-size: 0.95rem;
            color: var(--text-sub);
        }

        /* Skills Section */
        .skills {
            background-color: var(--white);
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }

        .skill-item {
            margin-bottom: 1.5rem;
        }

        .skill-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
